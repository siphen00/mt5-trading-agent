name: Weekly deep-dive review (Claude)

on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run weekly review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python journal/weekly_claude.py

      - name: Commit review
        run: |
          git config user.name "apex-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/journal.json
          git diff --cached --quiet || git commit -m "Weekly review $(date -u +%Y-%m-%d)"
          git push
