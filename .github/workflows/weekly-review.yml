name: Weekly deep-dive review (Ollama)

on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:1.5b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly review
        run: python journal/weekly_review.py

      - name: Commit review
        run: |
          git config user.name "apex-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/journal.json
          git diff --cached --quiet || git commit -m "Weekly review $(date -u +%Y-%m-%d)"
          git push
